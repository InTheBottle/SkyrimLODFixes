; Skyrim LOD Fixes v0.12.0 - configuration
; Install to: Data/SKSE/Plugins/SkyrimLODFixes.ini
; All values below are the defaults; delete this file to use them.

[General]

; Fixes distant LOD that never unloads after travelling. Resets the LOD
; quadtree after a long teleport or a worldspace change, including into
; modded worldspaces such as Bruma. LOD rebuilds over about a second afterwards.
bEnableLODReset = 1

; Crash fix for tree LOD and grass (BSMultiStreamInstanceTriShape::OnVisible).
; Culling waits for the engine's instance-group lock instead of racing it.
bEnableInstanceGroupLock = 1

; Logs LOD state after each loading screen and on worldspace switches.
; For diagnosing only; leave off while playing.
bLogDiagnostics = 0
