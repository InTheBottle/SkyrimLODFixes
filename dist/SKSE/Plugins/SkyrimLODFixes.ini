; Skyrim LOD Fixes v0.12.0 - configuration
; Install to: Data/SKSE/Plugins/SkyrimLODFixes.ini
; All values below are the defaults; delete this file to use them.

[General]

; Reset the LOD quadtree when the engine's own reset cannot fire.
;
; This is the fix for "distant LOD never unloads". BGSTerrainManager::Update
; releases every node's LOD only when the terrain manager pointer changes. Each
; worldspace builds its own manager, but a worldspace that borrows its parent's
; LOD data resolves to the parent's manager instead -- so Tamriel and
; WhiterunWorld share one, and the reset never runs. A long teleport inside a
; single worldspace has the same problem for a different reason: the per-frame
; walk stops descending at the first node that declines to subdivide, so
; everything loaded below the subtree you left is never visited and never
; released. It stays attached to the scene and on screen, which is why PCB cures
; it and no distance setting does.
;
; When a loading screen closes, the plugin compares where you were with where you
; are. If the manager changed it does nothing -- the engine handles that case
; itself. Otherwise, if the worldspace changed, or you moved further than
; uGridsToLoad cells, it calls the engine's own Detach(manager, 1, 1) and clears
; the initialised flag, which is what Update does on a manager switch it does
; recognise.
;
; LOD blanks and rebuilds over roughly a second afterwards. That is the engine
; refreshing one queued node per frame, and it is expected.
bEnableLODReset = 1

; Make tree LOD and grass culling hold the engine's instance-group lock.
;
; This is a crash fix. Tree LOD and grass are drawn as instanced shapes
; (BSMultiStreamInstanceTriShape) whose instances live in groups. The engine's
; terrain and grass updates add and remove those groups under a lock: adding can
; grow the group array, removing deletes the group. Culling walks the same array
; without taking the lock, so a culling pass that overlaps one of those updates
; can read a freed array or group. It shows up as a crash in
; BSMultiStreamInstanceTriShape::OnVisible with "LOD Trees" or grass in the
; crash log, for example while rendering water reflections.
;
; With this on, culling takes the same lock while it tests the groups and lets
; go before handing the shape to the renderer, so the time it is held is short.
; The plugin finds the lock and the call it releases at by checking the game's
; own code at startup; if anything does not match, it logs a warning and leaves
; the game untouched.
bEnableInstanceGroupLock = 1

; One state line on game load and after each loading screen: the active, own and
; resolved terrain managers, the quadtree levels, the refresh queue size, and how
; many nodes hold a map LOD handle.
;
; Off by default because it walks the whole node pool and follows handle pointers
; into scene nodes. Turn it on to diagnose, not to play. A queue size of 0 is
; worth reporting: it means the worldspace's LODSettings file names a level that
; matches no node, so its terrain LOD never refreshes after the initial build.
bLogDiagnostics = 0
